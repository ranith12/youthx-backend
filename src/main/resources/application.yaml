server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/youthx_db
    username: postgres
    password: ${DB_PASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

app:
  upload:
    dir: uploads

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000
